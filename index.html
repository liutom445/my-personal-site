<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hongyi Liu — The Ann Arbor Quarterly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="content.js"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>

  <script type="text/babel" data-presets="react">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "teal",
  "ornament": 4,
  "issueTag": "Spring · MMXXVI"
} /*EDITMODE-END*/;

function HomePage() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const router = useChapterRouter();
  const c = window.SITE_CONTENT;
  const m = c.masthead;

  // accent tweak
  React.useEffect(() => {
    const root = document.documentElement;
    const map = {
      salmon: { a: '#e07a5f', d: '#b85a44' },
      teal: { a: '#4f8a8b', d: '#2f5d63' },
      mustard: { a: '#d6a84a', d: '#a37a26' }
    };
    const v = map[t.accent] || map.salmon;
    root.style.setProperty('--salmon', v.a);
    root.style.setProperty('--salmon-deep', v.d);
  }, [t.accent]);

  const ornamentClass = t.ornament > 5 ? 'ornaments-full' : t.ornament > 2 ? 'ornaments-some' : 'ornaments-min';

  return (
    <div className={'page page-enter ' + ornamentClass} data-screen-label="01 Home">
          <div className="frame">
            {/* Masthead */}
            <header className="masthead">
              <div className="meta-row">
                <span className="l">{m.issueNo} · No. 04</span>
                <span className="pub">{m.publication}</span>
                <span className="r">{t.issueTag} · {m.price}</span>
              </div>
              <div className="thin-rule"></div>

              <div style={{ display: 'flex', justifyContent: 'center', margin: '14px 0 6px' }}>
                <span className="kicker">— {m.kicker} —</span>
              </div>

              <h1 className="name" style={{ fontSize: "100px" }}>{m.headline}</h1>

              <p className="subhead">{m.subhead}</p>

              <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', gap: 14, marginTop: 24 }}>
                <span style={{ flex: '0 0 60px', height: 1, background: 'var(--ink)' }}></span>
                <span className="mono" style={{ color: 'var(--teal-deep)', fontSize: 9.5, letterSpacing: '0.22em' }}>Biostatistician · Ann Arbor</span>
                <span style={{ flex: '0 0 60px', height: 1, background: 'var(--ink)' }}></span>
              </div>

              <div className="mono" style={{ marginTop: 22, color: 'var(--ink-2)' }}>
                {m.dateline}
              </div>
              <div className="double-rule" style={{ marginTop: 18 }}></div>
            </header>

            {/* Hero — illustrated portrait + colophon flanks */}
            <section className="hero">
              <div className="col-l">
                <span className="lbl">A note from the desk</span>
                <p style={{ fontStyle: 'italic', margin: 0, fontSize: 16 }}>
                  This dispatch is published quarterly, irregularly, and entirely from a small office in the School of Public Health, where the windows face east and the coffee is regrettable.
                </p>
              </div>

              <div style={{ display: 'flex', justifyContent: 'center' }}>
                <div className="portrait-card" style={{ width: 240 }}>
                  <span className="stamp">Editor in Residence</span>
                  <div className="frame-inner">{PORTRAIT_SVG}</div>
                  <div className="cap">Fig. 1 · The Author in his MS Attire</div>
                </div>
              </div>

              <div className="col-r">
                <span className="lbl">Featured this issue</span>
                <p style={{ fontStyle: 'italic', margin: 0, fontSize: 16 }}>
                  Four chapters on causes and effects, on data both real and unreliably collected, and a small archive of marginalia gathered along the way.
                </p>
              </div>
            </section>

            {/* Front-page index */}
            <section className="front-grid">
              {c.chapters.map((ch, i) =>
          <article key={ch.no} className="chapter-card"
          onClick={(e) => {
            if (ch.slug === 'about' || ch.slug === 'research') {
              router.go(e, ch.slug + '.html', `Chapter ${ch.no} · ${ch.title}`);
            }
          }}>
                  <div className="topline">
                    <span className="no">Chapter {ch.no}</span>
                    <span className="pg">{ch.page}</span>
                  </div>
                  <div className="kk">{ch.kicker}</div>
                  <h2 className="ttl">{ch.title}</h2>
                  <p className="blurb">{ch.blurb}</p>
                  <span className="turn">
                    {ch.slug === 'about' || ch.slug === 'research' ? 'Turn to chapter' : 'Forthcoming'}
                    <span>→</span>
                  </span>
                </article>
          )}
            </section>

            <Colophon />
          </div>

          <div className="pagenum">— Front Page —</div>
          <div className="pagenum r">№ 01</div>

          <Curtain active={router.curtainActive} activeLabel={router.curtainLabel} />

          <TweaksPanel>
            <TweakSection label="Palette" />
            <TweakRadio
          label="Accent"
          value={t.accent}
          options={['salmon', 'teal', 'mustard']}
          onChange={(v) => setTweak('accent', v)} />
            <TweakSection label="Ornament" />
            <TweakSlider
          label="Density"
          value={t.ornament}
          min={0} max={10} step={1}
          onChange={(v) => setTweak('ornament', v)} />
            <TweakSection label="Issue" />
            <TweakText
          label="Issue tag"
          value={t.issueTag}
          onChange={(v) => setTweak('issueTag', v)} />
          </TweaksPanel>
        </div>);

}

ReactDOM.createRoot(document.getElementById('app')).render(<HomePage />);
</script>
</body>
</html>
