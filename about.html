<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About — Hongyi Liu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="content.js"></script>
  <script type="text/babel" src="shared.jsx"></script>

  <script type="text/babel" data-presets="react">
    function AboutPage() {
      const router = useChapterRouter();
      const a = window.SITE_CONTENT.about;

      return (
        <div className="page page-enter" data-screen-label="02 About">
          <div className="frame">
            <TopBar active="about" onNavigate={router.go} />

            <header className="inner-head">
              <div className="chap">{a.chapter} · The Profile</div>
              <h1 className="ttl">{a.title}</h1>
              <p className="standfirst">{a.standfirst}</p>
              <div className="mono" style={{marginTop:14, color:'var(--ink-2)'}}>
                ✦ &nbsp; Filed from Ann Arbor, Michigan &nbsp; ✦
              </div>
            </header>

            <div className="double-rule" style={{margin:'18px 0 0'}}></div>

            <section className="about-grid">
              <aside>
                <div className="portrait-card">
                  <span className="stamp">Plate I</span>
                  <div className="frame-inner">{PORTRAIT_SVG}</div>
                  <div className="cap">{a.portraitCaption}</div>
                </div>

                <div style={{marginTop:24, padding:'14px 16px', border:'1px solid var(--ink)', background:'var(--paper-2)'}}>
                  <div className="mono" style={{color:'var(--salmon-deep)', marginBottom:8}}>Personalia</div>
                  <ul style={{margin:0, padding:0, listStyle:'none', fontSize:15, lineHeight:1.7}}>
                    <li><span className="mono" style={{color:'var(--teal-deep)', marginRight:8}}>res.</span> Ann Arbor, MI</li>
                    <li><span className="mono" style={{color:'var(--teal-deep)', marginRight:8}}>occ.</span> PhD Candidate</li>
                    <li><span className="mono" style={{color:'var(--teal-deep)', marginRight:8}}>dept.</span> Biostatistics</li>
                    <li><span className="mono" style={{color:'var(--teal-deep)', marginRight:8}}>est.</span> in this office, 2022</li>
                  </ul>
                </div>
              </aside>

              <div className="bio-col">
                <h2>A short biography</h2>
                {a.bio.map((p, i) => (
                  <p key={i} className={i === 0 ? 'dropcap' : ''}>{p}</p>
                ))}

                <div style={{marginTop:34}}>
                  <h2>Education</h2>
                  <ul className="edu-list">
                    {a.education.map((e, i) => (
                      <li key={i}>
                        <span className="yr">{e.yr}</span>
                        <div>
                          <div className="deg">{e.deg}</div>
                          <div className="inst">{e.inst}</div>
                        </div>
                      </li>
                    ))}
                  </ul>
                </div>

                <div style={{marginTop:34}}>
                  <h2>Subjects of inquiry</h2>
                  <div className="interest-grid">
                    {a.interests.map((it, i) => (
                      <div key={i} className="pill">{it}</div>
                    ))}
                  </div>
                </div>

                <div style={{marginTop:42, padding:'18px 22px', borderLeft:'3px solid var(--salmon)', background:'rgba(224,122,95,0.06)', fontStyle:'italic', fontSize:18}}>
                  “It is the mark of an educated mind to be able to entertain a thought without accepting it.”
                  <div className="mono" style={{marginTop:8, fontStyle:'normal', color:'var(--salmon-deep)'}}>— Aristotle</div>
                </div>
              </div>
            </section>

            <div style={{display:'flex', justifyContent:'space-between', marginTop:50, paddingTop:18, borderTop:'1px solid var(--ink)'}}>
              <a href="index.html" className="btn" onClick={(e) => router.go(e, 'index.html', 'Front Page')}>← Front Page</a>
              <a href="research.html" className="btn salmon" onClick={(e) => router.go(e, 'research.html', 'Chapter II · Research')}>Chapter II · Research →</a>
            </div>

            <Colophon />
          </div>

          <div className="pagenum">— About —</div>
          <div className="pagenum r">№ 02</div>

          <Curtain active={router.curtainActive} activeLabel={router.curtainLabel} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<AboutPage />);
  </script>
</body>
</html>
